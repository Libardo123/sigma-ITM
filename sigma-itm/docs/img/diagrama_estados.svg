<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nodeAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241e17"/>
      <stop offset="100%" stop-color="#17120a"/>
    </linearGradient>
    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b36"/>
      <stop offset="100%" stop-color="#181024"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132b23"/>
      <stop offset="100%" stop-color="#0b1c16"/>
    </linearGradient>
    <linearGradient id="nodeRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31181e"/>
      <stop offset="100%" stop-color="#1f0c10"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f87171"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#c084fc"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
    .node-title { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .node-code { font-family: 'Consolas', 'Courier New', monospace; font-size: 10px; font-weight: 600; fill: #38bdf8; }
    .node-desc { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
    .role-badge { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; }
    .label { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 9.5px; font-weight: 600; }
    .step-num { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 11px; font-weight: 800; }
  </style>

  <!-- Background -->
  <rect width="1200" height="740" rx="16" fill="url(#bgGrad)"/>
  <rect width="1198" height="738" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Top Decorative Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#headerGrad)"/>

  <!-- Header Section -->
  <g transform="translate(50, 45)">
    <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="26" text-anchor="middle" font-size="18">🔄</text>
    <text x="50" y="18" class="title">SIGMA ITM · Máquina de Estados y Ciclo de Vida</text>
    <text x="50" y="36" class="subtitle">Flujo determinístico de aprobación académica con control RBAC, validación documental y bitácora inmutable</text>
  </g>

  <!-- Legend Bar (Top Right) -->
  <g transform="translate(730, 40)">
    <rect width="420" height="42" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    
    <circle cx="20" cy="21" r="5" fill="#38bdf8"/>
    <text x="32" y="25" class="role-badge" fill="#93c5fd">Estudiante</text>

    <circle cx="115" cy="21" r="5" fill="#fbbf24"/>
    <text x="127" y="25" class="role-badge" fill="#fde047">Comité Grados</text>

    <circle cx="230" cy="21" r="5" fill="#c084fc"/>
    <text x="242" y="25" class="role-badge" fill="#d8b4fe">Docente Asesor</text>

    <circle cx="345" cy="21" r="5" fill="#34d399"/>
    <text x="357" y="25" class="role-badge" fill="#86efac">Terminal</text>
  </g>

  <!-- ======================================================== -->
  <!-- MAIN FLOW NODES (Row 1: Stages 1 to 4)                  -->
  <!-- ======================================================== -->

  <!-- START INDICATOR -->
  <g transform="translate(45, 175)">
    <circle cx="20" cy="40" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="20" cy="40" r="7" fill="#38bdf8"/>
    <text x="20" y="70" text-anchor="middle" class="label" fill="#64748b">Inicio</text>
    <line x1="38" y1="40" x2="68" y2="40" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- 1. POSTULACION -->
  <g transform="translate(120, 135)" filter="url(#cardShadow)">
    <rect width="215" height="120" rx="12" fill="url(#nodeBlue)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="12" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="22" y="26" text-anchor="middle" class="step-num" fill="#60a5fa">01</text>
    <text x="44" y="26" class="node-title">Postulación</text>
    <text x="22" y="48" class="node-code">POSTULACION</text>
    <text x="22" y="68" class="node-desc">• Radicación de iniciativa</text>
    <text x="22" y="83" class="node-desc">• Carga de requisitos mínimos</text>
    <rect x="22" y="93" width="75" height="17" rx="4" fill="#1e3a8a"/>
    <text x="60" y="105" text-anchor="middle" class="role-badge" fill="#93c5fd">ESTUDIANTE</text>
  </g>

  <!-- Transition 1 -> 2 -->
  <g>
    <line x1="335" y1="195" x2="390" y2="195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <rect x="338" y="170" width="50" height="18" rx="4" fill="#0b1120" stroke="#334155" stroke-width="0.8"/>
    <text x="363" y="182" text-anchor="middle" class="label" fill="#38bdf8">Radicar</text>
  </g>

  <!-- 2. REVISION_DOCUMENTAL -->
  <g transform="translate(395, 135)" filter="url(#cardShadow)">
    <rect width="225" height="120" rx="12" fill="url(#nodeAmber)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="12" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="22" y="26" text-anchor="middle" class="step-num" fill="#fbbf24">02</text>
    <text x="44" y="26" class="node-title">Revisión Documental</text>
    <text x="22" y="48" class="node-code" fill="#f59e0b">REVISION_DOCUMENTAL</text>
    <text x="22" y="68" class="node-desc">• Validación por magic bytes</text>
    <text x="22" y="83" class="node-desc">• Chequeo según modalidad</text>
    <rect x="22" y="93" width="65" height="17" rx="4" fill="#78350f"/>
    <text x="54.5" y="105" text-anchor="middle" class="role-badge" fill="#fde047">COMITÉ</text>
  </g>

  <!-- Self Loop 2 -> 2 (Corrección con Pausa) -->
  <g>
    <path d="M 470 135 C 470 85, 550 85, 550 130" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrowAmber)"/>
    <rect x="475" y="70" width="70" height="26" rx="4" fill="#18120a" stroke="#d97706" stroke-width="0.8"/>
    <text x="510" y="83" text-anchor="middle" class="label" fill="#fef08a">Subsanación</text>
    <text x="510" y="93" text-anchor="middle" font-size="8" fill="#fbbf24">(Pausa Avance)</text>
  </g>

  <!-- Transition 2 -> 3 -->
  <g>
    <line x1="620" y1="195" x2="675" y2="195" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="625" y="170" width="46" height="18" rx="4" fill="#0b1120" stroke="#334155" stroke-width="0.8"/>
    <text x="648" y="182" text-anchor="middle" class="label" fill="#34d399">Validar</text>
  </g>

  <!-- 3. APROBACION -->
  <g transform="translate(680, 135)" filter="url(#cardShadow)">
    <rect width="215" height="120" rx="12" fill="url(#nodeBlue)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="12" fill="#6366f1" fill-opacity="0.2"/>
    <text x="22" y="26" text-anchor="middle" class="step-num" fill="#818cf8">03</text>
    <text x="44" y="26" class="node-title">Aprobación Inicial</text>
    <text x="22" y="48" class="node-code" fill="#818cf8">APROBACION</text>
    <text x="22" y="68" class="node-desc">• Proyecto avalado formalmente</text>
    <text x="22" y="83" class="node-desc">• En cola para asignación</text>
    <rect x="22" y="93" width="65" height="17" rx="4" fill="#312e81"/>
    <text x="54.5" y="105" text-anchor="middle" class="role-badge" fill="#c7d2fe">COMITÉ</text>
  </g>

  <!-- Transition 3 -> 4 -->
  <g>
    <line x1="895" y1="195" x2="950" y2="195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <rect x="898" y="165" width="50" height="26" rx="4" fill="#0b1120" stroke="#334155" stroke-width="0.8"/>
    <text x="923" y="177" text-anchor="middle" class="label" fill="#38bdf8">Asignar</text>
    <text x="923" y="187" text-anchor="middle" font-size="8" fill="#94a3b8">+ Directriz</text>
  </g>

  <!-- 4. EN_PROCESO -->
  <g transform="translate(955, 135)" filter="url(#cardShadow)">
    <rect width="200" height="120" rx="12" fill="url(#nodePurple)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="12" fill="#a855f7" fill-opacity="0.2"/>
    <text x="22" y="26" text-anchor="middle" class="step-num" fill="#c084fc">04</text>
    <text x="44" y="26" class="node-title">En Proceso</text>
    <text x="22" y="48" class="node-code" fill="#c084fc">EN_PROCESO</text>
    <text x="22" y="68" class="node-desc">• Desarrollo técnico</text>
    <text x="22" y="83" class="node-desc">• Asesoría y entregables</text>
    <rect x="22" y="93" width="95" height="17" rx="4" fill="#581c87"/>
    <text x="69.5" y="105" text-anchor="middle" class="role-badge" fill="#e9d5ff">DOCENTE ASESOR</text>
  </g>

  <!-- Loop 4 -> 4 (Corrección de Entregables) -->
  <g>
    <path d="M 1030 135 C 1030 85, 1110 85, 1110 130" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrowPurple)"/>
    <rect x="1035" y="70" width="70" height="26" rx="4" fill="#181024" stroke="#a855f7" stroke-width="0.8"/>
    <text x="1070" y="83" text-anchor="middle" class="label" fill="#f3e8ff">Retroalim.</text>
    <text x="1070" y="93" text-anchor="middle" font-size="8" fill="#d8b4fe">(Subsanar)</text>
  </g>

  <!-- ======================================================== -->
  <!-- CONNECTOR ROW 1 TO ROW 2 (4 -> 5)                       -->
  <!-- ======================================================== -->
  <path d="M 1055 255 L 1055 350 L 980 350" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="1010" y="285" width="75" height="26" rx="4" fill="#0b1120" stroke="#334155" stroke-width="0.8"/>
  <text x="1047.5" y="297" text-anchor="middle" class="label" fill="#c084fc">Visto Bueno</text>
  <text x="1047.5" y="307" text-anchor="middle" font-size="8" fill="#94a3b8">del Asesor</text>

  <!-- ======================================================== -->
  <!-- MAIN FLOW NODES (Row 2: Stages 5 to 7)                  -->
  <!-- ======================================================== -->

  <!-- 5. SUSTENTACION -->
  <g transform="translate(745, 290)" filter="url(#cardShadow)">
    <rect width="230" height="120" rx="12" fill="url(#nodePurple)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="12" fill="#c084fc" fill-opacity="0.2"/>
    <text x="22" y="26" text-anchor="middle" class="step-num" fill="#e9d5ff">05</text>
    <text x="44" y="26" class="node-title">Sustentación</text>
    <text x="22" y="48" class="node-code" fill="#e9d5ff">SUSTENTACION</text>
    <text x="22" y="68" class="node-desc">• Citación: fecha, hora y aula</text>
    <text x="22" y="83" class="node-desc">• Exposición y evaluación</text>
    <rect x="22" y="93" width="95" height="17" rx="4" fill="#581c87"/>
    <text x="69.5" y="105" text-anchor="middle" class="role-badge" fill="#e9d5ff">DOCENTE ASESOR</text>
  </g>

  <!-- Transition 5 -> 6 -->
  <g>
    <line x1="745" y1="350" x2="675" y2="350" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <rect x="682" y="325" width="55" height="26" rx="4" fill="#0b1120" stroke="#334155" stroke-width="0.8"/>
    <text x="709.5" y="337" text-anchor="middle" class="label" fill="#38bdf8">Aprobar</text>
    <text x="709.5" y="347" text-anchor="middle" font-size="8" fill="#94a3b8">Exposición</text>
  </g>

  <!-- 6. REVISION_COMITE -->
  <g transform="translate(440, 290)" filter="url(#cardShadow)">
    <rect width="230" height="120" rx="12" fill="url(#nodeAmber)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="12" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="22" y="26" text-anchor="middle" class="step-num" fill="#fbbf24">06</text>
    <text x="44" y="26" class="node-title">Revisión Final Comité</text>
    <text x="22" y="48" class="node-code" fill="#fbbf24">REVISION_COMITE</text>
    <text x="22" y="68" class="node-desc">• Verificación de nota y jurados</text>
    <text x="22" y="83" class="node-desc">• Expedición Acta de Grado</text>
    <rect x="22" y="93" width="65" height="17" rx="4" fill="#78350f"/>
    <text x="54.5" y="105" text-anchor="middle" class="role-badge" fill="#fde047">COMITÉ</text>
  </g>

  <!-- Transition 6 -> 7 -->
  <g>
    <line x1="440" y1="350" x2="355" y2="350" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <rect x="365" y="325" width="65" height="26" rx="4" fill="#0b1120" stroke="#059669" stroke-width="0.8"/>
    <text x="397.5" y="337" text-anchor="middle" class="label" fill="#34d399">Ratificar</text>
    <text x="397.5" y="347" text-anchor="middle" font-size="8" fill="#86efac">por Acta</text>
  </g>

  <!-- 7. FINALIZADO (TERMINAL SUCCESS) -->
  <g transform="translate(120, 290)" filter="url(#cardShadow)">
    <rect width="230" height="120" rx="12" fill="url(#nodeGreen)" stroke="#10b981" stroke-width="2"/>
    <circle cx="22" cy="22" r="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="22" y="26" text-anchor="middle" font-size="14">🎓</text>
    <text x="44" y="26" class="node-title" fill="#a7f3d0">Finalizado</text>
    <text x="22" y="48" class="node-code" fill="#34d399">FINALIZADO (TERMINAL)</text>
    <text x="22" y="68" class="node-desc">• Opción de grado culminada</text>
    <text x="22" y="83" class="node-desc">• Descarga Certificado Oficial PDF</text>
    <rect x="22" y="93" width="105" height="17" rx="4" fill="#065f46"/>
    <text x="74.5" y="105" text-anchor="middle" class="role-badge" fill="#a7f3d0">PDF DISPONIBLE</text>
  </g>

  <!-- ======================================================== -->
  <!-- RECHAZADO NODE (TERMINAL FAILURE)                       -->
  <!-- ======================================================== -->
  <g transform="translate(440, 520)" filter="url(#cardShadow)">
    <rect width="320" height="110" rx="12" fill="url(#nodeRed)" stroke="#ef4444" stroke-width="1.8"/>
    <circle cx="24" cy="24" r="12" fill="#ef4444" fill-opacity="0.2"/>
    <text x="24" y="28" text-anchor="middle" font-size="14">⛔</text>
    <text x="46" y="28" class="node-title" fill="#fca5a5">Rechazado Definitivo</text>
    <text x="24" y="50" class="node-code" fill="#f87171">RECHAZADO (TERMINAL)</text>
    <text x="24" y="70" class="node-desc">• Trámite cancelado por causales reglamentarias</text>
    <text x="24" y="85" class="node-desc">• Registro inmutable en auditoría con causales</text>
  </g>

  <!-- Lines from stages to RECHAZADO -->
  <!-- From Postulacion -->
  <path d="M 227 255 L 227 575 L 435 575" fill="none" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="235" y="540" class="label" fill="#fca5a5" font-size="8.5">Sin requisitos</text>

  <!-- From Revision Documental -->
  <path d="M 507 255 L 507 515" fill="none" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="512" y="475" class="label" fill="#fca5a5" font-size="8.5">Rechazo docs</text>

  <!-- From En Proceso -->
  <path d="M 1055 350 L 1055 575 L 765 575" fill="none" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="880" y="567" class="label" fill="#fca5a5" font-size="8.5">Abandono / Incumplimiento</text>

  <!-- From Sustentacion -->
  <path d="M 860 410 L 860 545 L 765 545" fill="none" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <text x="800" y="535" class="label" fill="#fca5a5" font-size="8.5">Reprobada</text>

  <!-- Bottom Footer Note -->
  <g transform="translate(50, 685)">
    <rect width="1100" height="32" rx="6" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
    <text x="20" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
      <tspan fill="#38bdf8" font-weight="bold">🔒 Regla de Integridad:</tspan> Cuando <tspan fill="#fbbf24" font-weight="bold">requiere_correccion = true</tspan>, todo avance se bloquea de forma preventiva hasta que el estudiante radique la subsanación.
    </text>
  </g>
</svg>
